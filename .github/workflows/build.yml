# MediaTidy - test e build per Linux (AppImage), Windows (.exe) e macOS (.app).
#
# - Ogni push e ogni pull request: test su tutti e tre i sistemi, poi le tre build,
#   scaricabili come "Artifacts" dalla pagina dell'esecuzione (scheda Actions).
# - Quando PUBBLICHI una release su GitHub (da main o da un branch): costruisce i tre
#   pacchetti dal codice del tag e li allega da solo alla release. Il file del workflow
#   deve esistere nel commit a cui punta il tag: una release creata su un ramo che non
#   lo contiene non avvia nulla.
# - A mano: scheda Actions -> Build -> "Run workflow". Scrivendo il nome di una release
#   già esistente nel campo "release_tag", i file vengono allegati a quella release
#   (sostituendo quelli con lo stesso nome); lasciandolo vuoto restano solo gli Artifacts.
name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag di una release già esistente a cui allegare i file (facoltativo)"
        required: false
        default: ""

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Librerie di sistema per Qt (solo Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Dipendenze
        run: pip install -r requirements.txt pytest
      - name: Test
        run: python -m pytest -v tests

  build-windows:
    name: Build Windows (.exe)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Versione
        shell: bash
        run: echo "VERSION=$(python -c "import re;print(re.search(r'VERSION = \"(.+?)\"', open('config.py', encoding='utf-8').read()).group(1))")" >> "$GITHUB_ENV"
      - name: Dipendenze
        run: pip install -r requirements.txt pyinstaller pillow
      - name: PyInstaller
        shell: bash
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name MediaTidy
          --icon MT_Icon.png
          --add-data "MT_Icon.png;."
          --collect-all qtpy --collect-all requests
          media_tidy.py
      - name: Nome del file
        shell: bash
        run: mv dist/MediaTidy.exe "dist/MediaTidy-${VERSION}-windows-x64.exe"
      - uses: actions/upload-artifact@v5
        with:
          name: MediaTidy-windows
          path: dist/MediaTidy-*-windows-x64.exe
          retention-days: 30

  build-macos:
    name: Build macOS (.app)
    needs: test
    runs-on: macos-latest   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Versione
        run: echo "VERSION=$(python -c "import re;print(re.search(r'VERSION = \"(.+?)\"', open('config.py', encoding='utf-8').read()).group(1))")" >> "$GITHUB_ENV"
      - name: Dipendenze
        run: pip install -r requirements.txt pyinstaller pillow
      - name: PyInstaller
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name MediaTidy
          --icon MT_Icon.png
          --add-data "MT_Icon.png:."
          --osx-bundle-identifier io.github.shuren81.mediatidy
          --collect-all qtpy --collect-all requests
          media_tidy.py
      - name: Versione nell'Info.plist
        # PyInstaller scrive CFBundleShortVersionString ma non CFBundleVersion: "Set" fallirebbe
        # su una chiave inesistente, quindi si prova "Set" e, se manca, "Add".
        run: |
          PLIST=dist/MediaTidy.app/Contents/Info.plist
          for KEY in CFBundleShortVersionString CFBundleVersion; do
            /usr/libexec/PlistBuddy -c "Set :${KEY} ${VERSION}" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :${KEY} string ${VERSION}" "$PLIST"
          done
          /usr/libexec/PlistBuddy -c "Print" "$PLIST" | grep -E "CFBundle(Short)?Version"
      - name: Zip dell'app
        run: ditto -c -k --keepParent dist/MediaTidy.app "dist/MediaTidy-${VERSION}-macos-arm64.zip"
      - uses: actions/upload-artifact@v5
        with:
          name: MediaTidy-macos
          path: dist/MediaTidy-*-macos-arm64.zip
          retention-days: 30

  build-linux:
    name: Build Linux (AppImage)
    needs: test
    # Ubuntu 22.04: l'AppImage risultante funziona anche su distribuzioni con glibc
    # meno recente di quella delle versioni più nuove (es. Linux Mint 21).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Versione
        run: echo "VERSION=$(python -c "import re;print(re.search(r'VERSION = \"(.+?)\"', open('config.py', encoding='utf-8').read()).group(1))")" >> "$GITHUB_ENV"
      - name: Librerie di sistema per Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 file
      - name: Ambiente virtuale richiesto dallo script
        run: python -m venv venv
      - name: Build AppImage
        env:
          # appimagetool è a sua volta un'AppImage: nei runner manca FUSE, così si estrae da sé.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bash AppImage/build_appimage.sh
      - name: Nome del file
        run: mv dist/MediaTidy-x86_64.AppImage "dist/MediaTidy-${VERSION}-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v5
        with:
          name: MediaTidy-linux
          path: dist/MediaTidy-*-linux-x86_64.AppImage
          retention-days: 30

  release:
    name: Allega i file alla release
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: Allega i tre file
        uses: softprops/action-gh-release@v2
        with:
          # La release esiste già (l'hai creata tu): non se ne crea una nuova e non si
          # tocca lo stato (bozza/pubblicata). I file con lo stesso nome vengono sostituiti.
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag }}
          files: artifacts/*
